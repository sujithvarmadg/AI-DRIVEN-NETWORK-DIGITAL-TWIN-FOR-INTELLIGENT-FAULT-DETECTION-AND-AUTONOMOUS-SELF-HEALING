version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: network-twin-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/ml/saved_models:/app/ml/saved_models
      - ./backend/network_twin.db:/app/network_twin.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: network-twin-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
